name: Bambuddy
options:
  bundleIdPrefix: io.github.ajthom90
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Bambuddy:
    type: application
    platform: iOS
    sources:
      - path: Bambuddy
    resources:
      - path: Bambuddy/Resources
        optional: true
    info:
      path: Bambuddy/Info.plist
      properties:
        CFBundleDisplayName: Bambuddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsMultipleScenes: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Bambuddy connects to your self-hosted Bambuddy server on your local network.
        NSBonjourServices:
          - _http._tcp
        NSPhotoLibraryAddUsageDescription: Save camera snapshots and timelapses to your photo library.
        NSCameraUsageDescription: Scan QR codes and photograph spools.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ajthom90.Bambuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  BambuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BambuddyTests
    dependencies:
      - target: Bambuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ajthom90.BambuddyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bambuddy:
    build:
      targets:
        Bambuddy: all
        BambuddyTests: [test]
    test:
      targets:
        - BambuddyTests
